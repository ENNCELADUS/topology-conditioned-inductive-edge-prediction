# B0-alt: MLP over F0 mean-pooled features (architecture-independence arm), breadth_first split.
model:
  family: f0_mlp
  config: {} # empty -> src.model.b0_alt.F0PairMLP defaults
data:
  root: data
  strategy: breadth_first
  train_positives: train_plus # train_plus = all train+ | e_sup = supervision split only
  negative_ratio: 5
  partition_seed: 0
  token_budget: 131072 # unused on the f0_mlp path (kept for schema symmetry)
  batch_pairs: 1024
  num_workers: 0
  f0_cache: outputs/f0_cache/f0_matrix.pt
  expected_missing_features: [node_004764, node_007050]
optim:
  lr: 1.0e-4
  weight_decay: 0.01
  epochs: 30
  warmup_steps: 500
  grad_clip: 1.0
eval:
  patience: 8
  eval_every: 1
seed: 47
output_dir: outputs/b0_alt
mixed_precision: "no" # "no" | "bf16"; set to "bf16" for cluster GPU runs (edit here or pass a CLI override if added)
