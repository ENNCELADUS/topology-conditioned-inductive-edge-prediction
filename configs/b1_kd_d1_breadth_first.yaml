# B1 KD-D1 arm on the simple B0 protocol: V3.1 student + zero-init
# NodeFactorBottleneck (node_factor_dim: 64) + the shared KD anchor-context
# stream from outputs/distill/kd_targets_breadth_first_seed0
# (python -m src.distill.teacher_targets). Arms differ ONLY in the distill
# weights below (variable-control protocol); run one arm at a time via
# hpc/run.sh train <this config>.
model:
  family: v3_1
  config:
    input_dim: 1536
    d_model: 512
    encoder_layers: 3
    cross_attn_layers: 3
    n_heads: 8
    mlp_head:
      hidden_dims: [512, 256, 128]
      dropout: 0.2
      activation: gelu
      norm: layernorm
      spectral_norm: false
    regularization:
      dropout: 0.1
      token_dropout: 0.1
      cross_attention_dropout: 0.1
      stochastic_depth: 0.1
    rich_pooling:
      components: [mean, attn, max, gated]
    pair_readout:
      mode: pair_context_gated
      order_aggregation: abba_max
      spectral_norm: false
    mixing:
      mode: none
    node_factor_dim: 64
    label_smoothing: 0.05 # symmetric BCE smoothing, fixed V3.1 recipe
data:
  root: data
  strategy: breadth_first
  negative_ratio: 1 # F0-only; V3.1 trains on fixed balanced train_edges.txt rows
  token_budget: 131072
  batch_pairs: 1024
  num_workers: 0
  f0_cache: outputs/f0_cache/f0_matrix.pt
  expected_missing_features: [node_004764, node_007050]
optim:
  lr: 1.0e-4
  weight_decay: 0.05
  epochs: 25
  warmup_steps: 500 # unused while a onecycle scheduler is configured
  grad_clip: 1.0
  scheduler:
    type: onecycle
    max_lr: 1.0e-4
    pct_start: 0.1
    div_factor: 25
    final_div_factor: 10000
    anneal_strategy: cos
eval:
  patience: 10
  eval_every: 1
runtime:
  world_size: auto
  pack_dir: outputs/feature_packs/b0_v31_bf16
  pack_workers: 16
  loader_workers_per_rank: 4
  prefetch_factor: 4
  token_budget: 524288
  max_pairs_per_rank: 4096
  memory_limit_gib: 85.0
  # Stage budgets must sum exactly to total_budget_seconds (train_b0.py:722).
  # Measured ~42 s/epoch (train+eval) on 4x H20, so 25 epochs is ~1.1 ks;
  # train_eval is set to ~3x that. It is a hard subprocess timeout, so it is
  # sized generously rather than tightly.
  total_budget_seconds: 6780
  pack_budget_seconds: 300
  setup_probe_budget_seconds: 300
  train_eval_budget_seconds: 6000
  artifact_budget_seconds: 60
  # Post-publish held-out test protocol (val/test/candidate scoring + graph
  # assembly); not part of the pre-publish stage_total == total_budget_seconds
  # invariant above.
  reserve_seconds: 120
  probe_warmup_steps: 10
  probe_timed_steps: 30
seed: 0
output_dir: outputs/b1_stage/kd_d1
mixed_precision: "bf16" # pinned for the H20 E2 target
distill:
  targets_path: outputs/distill/kd_targets_breadth_first_seed0_v2
  w_logit: 1.0                     # GLNN-style pointwise soft-label KD
  anchors_per_step: 2
