# Full-neighborhood true-oracle DIAGNOSTIC arm. Launch only with
# `--run-kind diagnostic`; these artifacts are never formal. For each query
# pair, the generator gives GRIT the induced graph on both endpoints and all
# of their real one-hop neighbors, with every ground-truth positive edge in
# that node set except the queried edge itself. There is no neighbor cap.
#
# `conditioning_mode: pooled_adapter` is the only topology-conditioning path:
# variable-length node tokens are pooled inside GRIT, so classifier
# cross-attention never attends to batch-padding tokens. `edge_batch: 1` is
# deliberate. Live G_fit degree statistics are max=126 and p99=76 (G_hold
# max=36); the held-out test graph reaches degree 263 and a measured pair ego
# union of at least 446 nodes. Dense RRWP/GRIT work scales quadratically. A
# batch of one in training and the full-oracle scoring path preserves every
# neighbor while avoiding a sequence-length batcher's OOM confound.

model:
  family: egostitch_e2e
  config:
    generator:
      name: full_ego_oracle
      oracle_seed: 0
      oracle_truth_source: g_fit_plus_v_hold
      n_ground: 50
      feature_standardization: row_layernorm
    encoder:
      name: grit_gmt
      dim: 96
      layers: 4
      rrwp_k: 8
      n_heads: 8
      seeds: 4
      w_rel: 0.0
    classifier:
      name: b0_v31
      xattn_heads: 8
      n_inj: 1
      p_topo: 0.15
      permanent_null: none
      conditioning_mode: pooled_adapter

data:
  root: data
  strategy: breadth_first
  negative_ratio: 5
  node_batch: 256
  edge_batch: 1
  f0_cache: outputs/feature_packs/egostitch_f0/f0_matrix.pt
  grounding_cache: outputs/feature_packs/egostitch_f0/grounding.npz
  pack_dir: outputs/feature_packs/egostitch_e2e_tokens
  expected_missing_features:
    - node_004764
    - node_007050

optim:
  lr: 1.0e-4
  weight_decay: 0.01
  epochs: 30
  warmup_steps: 500
  grad_clip: 1.0

training:
  positive_weight: 5.0
  phase_a_fraction: 0.0
  phase_b_fraction: 0.1
  lr_peak: 1.0e-4
  min_lr: 1.0e-5
  warmup_steps: 500
  betas: [0.9, 0.999]
  eps: 1.0e-8
  clip_norm: 1.0
  pair_encoder_clip_norm: 3.0
  generator_clip_norm: 3.0
  clip_immediate_abort: 1.0e-3
  clip_persistent_threshold: 0.1
  clip_persistent_steps: 10
  family_ratio_abort: 50.0
  family_ratio_probes: 4
  collapse_fraction: 0.25
  collapse_floor: 1.0e-4
  collapse_validations: 2
  selection_auprc_tolerance: 0.02
  selection_mmd_tolerance: 1.0e-6
  residual_ratio_min: 1.0e-3

diagnostics:
  gradient_probe_interval: 50
  gradient_imbalance_ratio: 50.0
  gradient_imbalance_steps: 200
  probe_s1_abs_mean_max: 1000.0
  selection_auprc_tolerance: 0.02
  topk_fraction: 0.01

eval:
  patience: 10
  eval_every: 1

seed: 0
output_dir: outputs/egostitch_e2e_stage1_v3/full_ego_oracle_grit_pooled_diagnostic
mixed_precision: "bf16"

runtime:
  world_size: auto
  pack_dir: outputs/feature_packs/egostitch_e2e_v_hold_ng50
  pack_workers: 8
  loader_workers_per_rank: 0
  prefetch_factor: 2
  token_budget: 128
  max_pairs_per_rank: 1048576
  memory_limit_gib: 85.0
  total_budget_seconds: 44520
  pack_budget_seconds: 1200
  train_eval_budget_seconds: 43200
  artifact_budget_seconds: 120
