# EgoStitch E2E Wave-1 oracle-scaffold R0 arm (docs/superpowers/specs/
# 2026-08-04-oracle-scaffold-experiment-design.md): identical to
# `egostitch_e2e_v3_null_generator_breadth_first.yaml` (`generator.name:
# "null"` -> `NullGenerator`, `stitch` always returns `None`, `cond=None`,
# the classifier scores every pair unconditioned -- the pure pairwise (B0)
# baseline reachable by config alone) except this arm actually TRAINS the
# classifier instead of only being scoring-eligible.
#
# `feature_standardization` stays `row_layernorm` for the same reason as the
# sibling null-generator config: `NullGenerator` carries no `EgoStitchConfig`
# of its own to bind V_fit statistics onto, so `zscore_vfit_v1` has nothing
# to bind against here regardless of which arm is trainable.
#
# `classifier.conditioning_mode` is schema-required (per the concurrent
# ClassifierConfig change) but semantically inert on this arm: `cond` is
# always `None` for a null generator, so no conditioning pathway ever runs.
# Set to "xattn_cls" as an arbitrary-but-valid placeholder per instruction,
# not because xattn_cls is exercised here.
#
# SCHEMA ASSUMPTION pending concurrent implementation (verify at
# integration, spec doc §"Owner decisions flagged, not made"): as of the
# pre-wave-1 code, `train_egostitch.py:1082-1107` raises
# `RuntimeError("the null-generator arm is scoring-only and not yet
# trainable...")` whenever the `generator` optimizer-parameter group comes
# back empty and `model.generator` is a `NullGenerator` -- which it always
# is here, since a null generator has zero parameters and forces
# `self.encoder is None` (no encoder parameters either). This config is
# unrunnable end-to-end until the concurrent "trainer support for empty
# parameter groups (null arm trainable)" work lands and changes that
# refusal into a real training path for the classifier-only parameter
# group. It is also not represented in the closed `E2EArmName` Literal
# (`train_egostitch.py:686-693`, values: full / b0_e2e_f_only / p0 /
# no_l_rel / row_layernorm / null_generator) or `_e2e_arm_name_from_config`
# (`:3393-3404`), which returns `"null_generator"` for any
# `generator.name == "null"` regardless of trainability -- this arm and the
# existing scoring-only null-generator arm collide under that name today.

model:
  family: egostitch_e2e
  config:
    generator:
      name: "null"
      n_ground: 50
      feature_standardization: row_layernorm
    encoder:
      name: ste_typed
      dim: 128
      layers: 3
    classifier:
      name: b0_v31
      xattn_heads: 8
      n_inj: 1
      p_topo: 0.15
      permanent_null: none
      conditioning_mode: xattn_cls

data:
  root: data
  strategy: breadth_first
  negative_ratio: 5
  node_batch: 256
  edge_batch: 128
  f0_cache: outputs/feature_packs/egostitch_f0/f0_matrix.pt
  grounding_cache: outputs/feature_packs/egostitch_f0/grounding.npz
  pack_dir: outputs/feature_packs/egostitch_e2e_tokens
  expected_missing_features:
    - node_004764
    - node_007050

optim:
  lr: 1.0e-4
  weight_decay: 0.01
  epochs: 30
  warmup_steps: 500
  grad_clip: 1.0

training:
  positive_weight: 5.0
  phase_a_fraction: 0.2
  phase_b_fraction: 0.1
  lr_peak: 1.0e-4
  min_lr: 1.0e-5
  warmup_steps: 500
  betas: [0.9, 0.999]
  eps: 1.0e-8
  clip_norm: 1.0
  pair_encoder_clip_norm: 3.0
  generator_clip_norm: 3.0
  clip_immediate_abort: 1.0e-3
  clip_persistent_threshold: 0.1
  clip_persistent_steps: 10
  family_ratio_abort: 50.0
  family_ratio_probes: 4
  collapse_fraction: 0.25
  collapse_floor: 1.0e-4
  collapse_validations: 2
  selection_auprc_tolerance: 0.02
  selection_mmd_tolerance: 1.0e-6
  residual_ratio_min: 1.0e-3

diagnostics:
  gradient_probe_interval: 50
  gradient_imbalance_ratio: 50.0
  gradient_imbalance_steps: 200
  probe_s1_abs_mean_max: 1000.0
  selection_auprc_tolerance: 0.02
  topk_fraction: 0.01

eval:
  patience: 10
  eval_every: 1

seed: 0
output_dir: outputs/egostitch_e2e_stage1_v3/null_trainable
mixed_precision: "bf16"

runtime:
  world_size: auto
  pack_dir: outputs/feature_packs/egostitch_e2e_v_hold_ng50
  pack_workers: 8
  loader_workers_per_rank: 0
  prefetch_factor: 2
  token_budget: 128
  max_pairs_per_rank: 1048576
  memory_limit_gib: 85.0
  total_budget_seconds: 27720
  pack_budget_seconds: 1200
  train_eval_budget_seconds: 26400
  artifact_budget_seconds: 120
