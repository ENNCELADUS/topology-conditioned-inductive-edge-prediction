# Wave-1 oracle-scaffold LOCAL SMOKE TEST (docs/superpowers/specs/2026-08-04-
# oracle-scaffold-experiment-design.md): a 2-epoch, tiny-batch/tiny-token-
# budget variant of `egostitch_e2e_v3_oracle_grit_xattn_cls_breadth_first.yaml`,
# same schema, for verifying the config parses and the oracle_struct/grit_gmt/
# conditioning_mode wiring runs end to end locally before spending real
# compute. NOT a scientific arm -- do not report metrics from this config,
# and do not reuse its `output_dir`.
#
# Shrunk relative to the real R1 arm: `optim.epochs`/data batch sizes/
# `runtime.token_budget`/`runtime.max_pairs_per_rank`/`runtime.*_budget_seconds`
# all reduced; `runtime.pack_dir` is left pointed at the real ng50 pack for
# convenience (no dedicated tiny-fixture pack exists yet) -- if a smaller
# fixture pack is added, repoint this field rather than the real R1 configs.
#
# Carries the same SCHEMA ASSUMPTIONS as the sibling `..._oracle_grit_*_...`
# configs (oracle_struct/grit_gmt registry keys, EncoderConfig's
# rrwp_k/n_heads/seeds, ClassifierConfig.conditioning_mode, and the
# `_e2e_arm_name_from_config`/`E2EArmName` gap where `encoder.w_rel == 0.0`
# would misclassify this arm as the legacy `no_l_rel` arm) -- see that
# file's header for the full rationale, not repeated here.

model:
  family: egostitch_e2e
  config:
    generator:
      name: oracle_struct
      oracle_seed: 0
      n_ground: 50
      feature_standardization: row_layernorm
    encoder:
      name: grit_gmt
      dim: 96
      layers: 4
      rrwp_k: 8
      n_heads: 8
      seeds: 4
      w_rel: 0.0
    classifier:
      name: b0_v31
      xattn_heads: 8
      n_inj: 1
      p_topo: 0.15
      permanent_null: none
      conditioning_mode: xattn_cls

data:
  root: data
  strategy: breadth_first
  negative_ratio: 5
  node_batch: 32
  edge_batch: 16
  f0_cache: outputs/feature_packs/egostitch_f0/f0_matrix.pt
  grounding_cache: outputs/feature_packs/egostitch_f0/grounding.npz
  pack_dir: outputs/feature_packs/egostitch_e2e_tokens
  expected_missing_features:
    - node_004764
    - node_007050

optim:
  lr: 1.0e-4
  weight_decay: 0.01
  epochs: 2
  warmup_steps: 10
  grad_clip: 1.0

training:
  positive_weight: 5.0
  phase_a_fraction: 0.0
  phase_b_fraction: 0.1
  lr_peak: 1.0e-4
  min_lr: 1.0e-5
  warmup_steps: 10
  betas: [0.9, 0.999]
  eps: 1.0e-8
  clip_norm: 1.0
  pair_encoder_clip_norm: 3.0
  generator_clip_norm: 3.0
  clip_immediate_abort: 1.0e-3
  clip_persistent_threshold: 0.1
  clip_persistent_steps: 10
  family_ratio_abort: 50.0
  family_ratio_probes: 4
  collapse_fraction: 0.25
  collapse_floor: 1.0e-4
  collapse_validations: 2
  selection_auprc_tolerance: 0.02
  selection_mmd_tolerance: 1.0e-6
  residual_ratio_min: 1.0e-3

diagnostics:
  gradient_probe_interval: 5
  gradient_imbalance_ratio: 50.0
  gradient_imbalance_steps: 20
  probe_s1_abs_mean_max: 1000.0
  selection_auprc_tolerance: 0.02
  topk_fraction: 0.01

eval:
  patience: 10
  eval_every: 1

seed: 0
output_dir: outputs/egostitch_e2e_smoke/oracle_grit_xattn_cls
mixed_precision: "bf16"

runtime:
  world_size: auto
  pack_dir: outputs/feature_packs/egostitch_e2e_v_hold_ng50
  pack_workers: 2
  loader_workers_per_rank: 0
  prefetch_factor: 2
  token_budget: 16
  max_pairs_per_rank: 4096
  memory_limit_gib: 16.0
  total_budget_seconds: 600
  pack_budget_seconds: 60
  train_eval_budget_seconds: 500
  artifact_budget_seconds: 40
