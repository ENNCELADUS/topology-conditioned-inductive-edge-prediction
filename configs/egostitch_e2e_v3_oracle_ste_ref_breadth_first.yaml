# EgoStitch true-oracle V_hold-truth DIAGNOSTIC reference arm (docs/superpowers/
# specs/2026-08-04-oracle-scaffold-experiment-design.md): same
# `generator.name: "oracle_struct"` (G_fit plus internal V_hold positives,
# leave-one-out partner masking at stitch time) as the `..._oracle_grit_*_...`
# ladder, but paired
# with the existing `ste_typed` encoder at its standard dims (128/3, same
# as `full`/`null_generator`/etc.) instead of the new `grit_gmt` encoder.
# This arm exists to separate "does the oracle signal help at all" from
# "does the new GRIT+PMA encoder help" -- if `ste_typed` conditioned on the
# oracle table already closes most of the gap, the grit ladder's marginal
# value is smaller than it looks in isolation.
#
# `classifier.conditioning_mode: "xattn_cls"` is a PLACEHOLDER. Per
# instruction: pin the actual mode to the winner of the
# `..._oracle_grit_{film_logit,pooled_adapter,xattn_cls,xattn_tokens}_...`
# conditioning ladder before launching this arm for real -- do not treat
# "xattn_cls" here as a considered choice for this encoder.
# Launch only with `--run-kind diagnostic`; artifacts are never formal.
#
# `feature_standardization: row_layernorm` for the same reason as the
# sibling oracle_grit configs (see their header comment for the full
# rationale): `oracle_struct` is a zero-parameter table lookup with no
# `EgoStitchConfig`/decoder of its own to bind V_fit statistics onto.
#
# VERIFIED INTEGRATION: `oracle_struct`, oracle arm naming, conditioning-mode
# parsing, and configurable phase fractions are live. The placeholder
# conditioning choice above remains the only pre-launch decision for this arm.

model:
  family: egostitch_e2e
  config:
    generator:
      name: oracle_struct
      oracle_seed: 0
      oracle_truth_source: g_fit_plus_v_hold
      n_ground: 50
      feature_standardization: row_layernorm
    encoder:
      name: ste_typed
      dim: 128
      layers: 3
    classifier:
      name: b0_v31
      xattn_heads: 8
      n_inj: 1
      p_topo: 0.15
      permanent_null: none
      # PLACEHOLDER -- re-pin to the grit ladder's winning mode before launch.
      conditioning_mode: xattn_cls

data:
  root: data
  strategy: breadth_first
  negative_ratio: 5
  node_batch: 256
  edge_batch: 128
  f0_cache: outputs/feature_packs/egostitch_f0/f0_matrix.pt
  grounding_cache: outputs/feature_packs/egostitch_f0/grounding.npz
  pack_dir: outputs/feature_packs/egostitch_e2e_tokens
  expected_missing_features:
    - node_004764
    - node_007050

optim:
  lr: 1.0e-4
  weight_decay: 0.01
  epochs: 30
  warmup_steps: 500
  grad_clip: 1.0

training:
  positive_weight: 5.0
  phase_a_fraction: 0.0
  phase_b_fraction: 0.1
  lr_peak: 1.0e-4
  min_lr: 1.0e-5
  warmup_steps: 500
  betas: [0.9, 0.999]
  eps: 1.0e-8
  clip_norm: 1.0
  pair_encoder_clip_norm: 3.0
  generator_clip_norm: 3.0
  clip_immediate_abort: 1.0e-3
  clip_persistent_threshold: 0.1
  clip_persistent_steps: 10
  family_ratio_abort: 50.0
  family_ratio_probes: 4
  collapse_fraction: 0.25
  collapse_floor: 1.0e-4
  collapse_validations: 2
  residual_ratio_min: 1.0e-3

diagnostics:
  gradient_probe_interval: 50
  gradient_imbalance_ratio: 50.0
  gradient_imbalance_steps: 200
  probe_s1_abs_mean_max: 1000.0
  topk_fraction: 0.01

eval:
  patience: 10
  eval_every: 1

seed: 0
output_dir: outputs/egostitch_e2e_stage1_v3/oracle_ste_ref_true_oracle_diagnostic
mixed_precision: "bf16"

runtime:
  world_size: auto
  pack_dir: outputs/feature_packs/egostitch_e2e_v_hold_ng50
  pack_workers: 8
  loader_workers_per_rank: 0
  prefetch_factor: 2
  token_budget: 128
  max_pairs_per_rank: 1048576
  memory_limit_gib: 85.0
  total_budget_seconds: 44520
  pack_budget_seconds: 1200
  train_eval_budget_seconds: 43200
  artifact_budget_seconds: 120
