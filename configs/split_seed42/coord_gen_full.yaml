# coord_gen_full: Stage II of the topology-representation-transfer pipeline.
# A coordinate generator g(x_u, x_v) predicts the queried pair's standardised
# structural coordinates from the frozen Stage I reader's endpoint states; the
# reader (topo_prompt_full, frozen: encoder, trunk, prompt interface, head and
# coordinate statistics) reads the prediction through the prompt interface it
# learned on true structure. Only the generator trains, on coordinate supervision
# + task BCE + light logit KD towards the same reader on true coordinates. The
# deployed model is a function of (x_u, x_v) alone, so this is a formal run:
#   hpc/run.sh train configs/split_seed42/coord_gen_full.yaml
# Spec: docs/superpowers/specs/2026-09-13-topology-prompt-stage2-design.md.
model:
  family: v3_1_coord_gen
  config:
    coord_gen:
      reader_checkpoint: outputs/split_seed42/topo_prompt_full/best.pt
      hidden: 512
      layers: 2
      dropout: 0.1
      w_coord: 1.0
      w_task: 1.0
      w_kd: 0.1
data:
  root: data
  strategy: breadth_first
  negative_ratio: 5
  token_budget: 131072
  batch_pairs: 1024
  num_workers: 0
  f0_cache: outputs/f0_cache/f0_matrix.pt
  expected_missing_features: [node_004764, node_007050]
optim:
  lr: 1.0e-3
  weight_decay: 0.05
  epochs: 25
  warmup_steps: 500
  grad_clip: 1.0
  scheduler:
    type: onecycle
    max_lr: 1.0e-3
    pct_start: 0.1
    div_factor: 25
    final_div_factor: 10000
    anneal_strategy: cos
eval:
  patience: 10
  eval_every: 1
runtime:
  world_size: auto
  pack_dir: outputs/feature_packs/b0_v31_bf16
  pack_workers: 16
  loader_workers_per_rank: 4
  prefetch_factor: 4
  token_budget: 196608
  max_pairs_per_rank: 1536
  memory_limit_gib: 85.0
  probe_warmup_steps: 10
  probe_timed_steps: 30
seed: 0
output_dir: outputs/split_seed42/coord_gen_full
mixed_precision: "bf16"
