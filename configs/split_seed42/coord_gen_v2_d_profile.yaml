# Profiling copy of coord_gen_v2_d: ONE epoch on the v1 Stage I reader, --skip-test only.
# Measures the Stage II step cost (spec §3.4) and exercises the v2 path end to end;
# never a reported row. Reader is the historical topo_prompt_full checkpoint.
# Supply the explicitly selected immutable reader checkpoint before downstream use.
# Study trials use --skip-test; full 15-epoch schedule, no early stopping.
# Spec: docs/superpowers/specs/2026-09-13-topology-prompt-two-stage-v2-design.md
model:
  family: v3_1_coord_gen
  config:
    coord_gen:
      reader_checkpoint: outputs/split_seed42/topo_prompt_full/best.pt
      trainable: interface_head
      hidden: 512
      layers: 2
      dropout: 0.1
      endpoint_hidden: 256
      endpoint_dropout: 0.3
      endpoint_weight_decay: 0.1
      w_coord: 1.0
      kd_alpha: 0.5
      w_anchor: 1.0
      anchor_temperature: 1.0
      w_kd_rep: 0.0
data:
  root: data
  strategy: breadth_first
  negative_ratio: 5
  token_budget: 131072
  batch_pairs: 1024
  num_workers: 0
  f0_cache: outputs/f0_cache/f0_matrix.pt
  expected_missing_features:
  - node_004764
  - node_007050
optim:
  lr: 0.0003
  weight_decay: 0.05
  epochs: 1
  warmup_steps: 500
  grad_clip: 1.0
  scheduler:
    type: onecycle
    max_lr: 0.0003
    pct_start: 0.1
    div_factor: 25
    final_div_factor: 100
    anneal_strategy: cos
  groups:
    generator:
      max_lr: 0.0003
    interface:
      max_lr: 0.0001
eval:
  patience: null
  eval_every: 1
runtime:
  world_size: auto
  pack_dir: outputs/feature_packs/b0_v31_bf16
  pack_workers: 16
  loader_workers_per_rank: 4
  prefetch_factor: 4
  token_budget: 196608
  max_pairs_per_rank: 1536
  memory_limit_gib: 85.0
  probe_warmup_steps: 10
  probe_timed_steps: 30
seed: 0
output_dir: outputs/split_seed42/profile_coord_gen_v2_d
mixed_precision: bf16
struct:
  nodes: 40
  background_nodes: 8
  mix:
    bfs: 0.5
    motif: 0.25
    bridge: 0.25
  subgraphs_per_epoch: null
  weights:
    bce: 1.0
    gs: 0.0
    rd: 0.0
    deg_mmd: 0.0
    rank: 1.0
    degree: 0.1
    motif: 0.1
  rank_margin: 0.1
  rank_temperature: 1.0
  huber_delta: 1.0
  mmd_sigma: 1.25
  mmd_bins: 48
  val_subgraphs: 32
  scale: 1.0
