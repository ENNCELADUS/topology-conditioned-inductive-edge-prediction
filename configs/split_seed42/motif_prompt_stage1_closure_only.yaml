# Stage I of the closure-only ablation (spec section 8): the bridge family is
# zeroed in BOTH stages, so the closure-only Stage II arm loads a reader, count head
# and adapter that never saw a bridge edge. Identical to motif_prompt_stage1 in every
# other key; it is the same ceiling diagnostic and is launched the same way:
#   hpc/run.sh train configs/split_seed42/motif_prompt_stage1_closure_only.yaml --run-kind diagnostic
# The base Stage I of the motif-graph GRIT prompt teaches the reader and the interface on a
# bounded TRUE graph. The prefix_base trunk, its encoder and its head stay frozen;
# the GRIT reader, the count head, the token projections, the role embeddings and
# the prefix adapter/gates train. Compiled templates come from the legal training
# graph minus the queried edge; V_val templates are held-out truth, so this is a
# CEILING DIAGNOSTIC, never a deployable arm:
#   hpc/run.sh train configs/split_seed42/motif_prompt_stage1.yaml --run-kind diagnostic
# and it scores with --allow-oracle-diagnostic. Stage I success proves only that a
# bounded true graph is usable through this interface; it is not evidence of
# endpoint-only transfer (spec section 7.2).
# Split: seed 42, root node_007630. No key selects another.
# Spec: docs/superpowers/specs/2026-09-16-motif-graph-grit-prompt-design.md
model:
  family: v3_1_motif_prompt
  config:
    motif_prompt:
      stage: one
      base_checkpoint: outputs/split_seed42/prefix_base/best.pt
      width: 128
      slots_per_field: 2
      reader: {layers: 3, dim: 96, heads: 4, rrwp_k: 4}
      corruption: {prob: 0.5, lambda_min: 0.0, lambda_max: 1.0}
      fields: [topo_self, topo_partner, topo_rel, topo_cnt]
      families: [closure]
      token_source: graph
      gate_mode: learned
      interface_warmup_epochs: 0 # the interface is what Stage I trains; no warm-up
      w_slot: 1.0
      w_topo: 0.0 # no teacher exists in Stage I, so L_topo has no target
      beta_p: 1.0
      beta_q: 1.0
      beta_a: 1.0
      beta_i: 1.0
      huber_delta: 1.0
data:
  root: data
  strategy: breadth_first
  negative_ratio: 5 # dynamic 1:5 stream, refreshed each epoch
  token_budget: 131072
  batch_pairs: 1024
  num_workers: 0
  f0_cache: outputs/f0_cache/f0_matrix.pt
  expected_missing_features: [node_004764, node_007050]
optim:
  lr: 1.0e-4
  weight_decay: 1.0e-2
  epochs: 15
  warmup_steps: 500 # unused while a onecycle scheduler is configured
  grad_clip: 1.0
  scheduler:
    type: onecycle
    max_lr: 1.0e-4
    pct_start: 0.1
    div_factor: 25
    final_div_factor: 10000
    anneal_strategy: cos
  groups:
    generator: {max_lr: 1.0e-4}
    # Stage I has no generator, so the interface is the only optimizer group and
    # it trains the whole reader at spec section 7.2's 1e-4. The 0.1x interface
    # rate is section 7.5's Stage II rule and does not apply here.
    interface: {max_lr: 1.0e-4}
eval:
  patience: null # full 15-epoch schedule, no early stopping (spec section 7.2)
  eval_every: 1
runtime:
  world_size: auto
  pack_dir: outputs/feature_packs/b0_v31_bf16
  pack_workers: 16
  loader_workers_per_rank: 4
  prefetch_factor: 4
  # The prefix arms' halved micro-batch, shared by every arm of this family
  # (Stage I, Stage II, every section 8 control and the teachability pilots), so
  # max_pairs_per_rank is this family's fixed batching protocol and never a
  # per-arm compute lever (spec section 7.1).
  token_budget: 196608
  max_pairs_per_rank: 1536
  memory_limit_gib: 85.0
  probe_warmup_steps: 10
  probe_timed_steps: 30
seed: 0
output_dir: outputs/split_seed42/motif_prompt_stage1_closure_only
mixed_precision: "bf16"
struct:
  nodes: 40
  background_nodes: 8
  mix: {bfs: 0.5, motif: 0.25, bridge: 0.25}
  subgraphs_per_epoch: null
  weights: {bce: 1.0, gs: 0.0, rd: 0.0, deg_mmd: 0.0, rank: 1.0, degree: 0.1, motif: 0.1}
  rank_margin: 0.1
  rank_temperature: 1.0
  huber_delta: 1.0
  mmd_sigma: 1.25
  mmd_bins: 48
  val_subgraphs: 32
  # The only legal memory lever (spec section 7.1): it chunks the sampled
  # subgraph's pair scoring, so every legal pair is still scored exactly once
  # into the same assembled logit matrix and the objective is unchanged. Set
  # conservatively at 1/16 of data.token_budget because the struct arms were
  # already measured at 81.7 GiB/rank against the 85 GiB cap, and this family
  # adds a 26-slot GRIT reader, its fp32 RRWP stack and one compiled motif graph
  # per structural pair on top of that. Raise it only from the epoch profile.
  # Neither subgraphs_per_epoch nor runtime.max_pairs_per_rank may be traded for
  # wall time: the first halves structural supervision, the second changes the
  # global batch, the optimizer-step count and hence the structural-subgraph count.
  token_budget: 8192
