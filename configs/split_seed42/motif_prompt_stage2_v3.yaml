# Wave 3 of the motif-graph GRIT prompt's Stage II: the MAIN deployable arm. A
# residue-conditioned generator G predicts the 96 motif edge weights from
# (x_u, x_v) alone; the Stage I bundle -- GRIT reader, count head, token
# projections, role embeddings and the prefix adapter with its gates --
# initialises both the student interface and the immutable teacher R_T, and the
# frozen prefix_base trunk reads the predicted graph through the same four gated
# KV-prefix token fields. Scoring loads only the saved model and endpoint
# features: no node ids, no neighbour lookup, no truth graph, no bank, no
# universe statistic. Launched as a formal run, without --run-kind.
#
# ADOPTED 2026-09-19: the generator setting is the first one to pass all three
# pre-registered pilot-B rules on a prefix,
# configs/split_seed42/motif_prompt_stage2_v3_novln_balanced_prefix.yaml
# (outputs/analysis/motif_pilot_b_motif_prompt_stage2_v3_novln_balanced_prefix/pilot_b.md:
# held-out L_G 0.0510 vs the constant's 0.0595 and val_cls 0.0934 vs 0.1081,
# recon 0.562/0.648, transplant +93% on held-out train, downstream s2_pred
# 0.8175 vs gates_off 0.8136). It is wave 2's winning "init-only" prefix -- F1
# closure_bias_init: nonzero_mean, F3 warmup_losses: graph_only + w_slot:
# balanced, and the wave-1 loss (beta_c 0.0) -- plus the three wave-3 keys that
# pass only together: F4 slot_read: residual_block, the un-normalised value path
# (slot_read_value_norm: false) and the closure-balanced graph-loss rows
# (graph_row_weighting: closure_balanced at graph_row_positive_share: 0.5).
# Each of the three alone left G on the empty-closure constant. The wave-1 and
# wave-2 configs keep the bare read only so their published rows stay
# reproducible.
#
# Epochs 1-8 hold the interface at LR 0 and train G on L_G alone (A1: the OLD
# generator's eight-epoch warm-up peaked at epoch 6, so two epochs under-trained
# it); epoch 9 opens the interface at 0.1x the generator LR (spec section 7.5)
# and fixes w_slot once from the gradient-norm probe. What the open interface
# does to the generator -- joint vs detached, i.e. the value of warmup_losses
# once the interface opens -- is the open question of the concurrent
# `graph_only_always` experiment; this arm keeps warmup_losses: graph_only until
# that lands.
#
# Joint-phase arm, CONTINUED from its own eight-epoch graph-only prefix:
#   hpc/run.sh train configs/split_seed42/motif_prompt_stage2_v3.yaml --resume-attempt \
#     outputs/split_seed42/motif_prompt_stage2_v3_prefix/attempts/<attempt id>
# (the prefix is configs/split_seed42/motif_prompt_stage2_v3_prefix.yaml, run
# with --skip-test). The two configs differ only in output_dir and the halt
# point, so the resume comparison of src/train_b0.py accepts the continuation
# whatever the warm-up's inert-key rule decides.
# Split: seed 42, root node_007630. No key selects another.
# Spec: docs/superpowers/specs/2026-09-16-motif-graph-grit-prompt-design.md
# Plan: docs/tmp/2026-09-18-motif-stage2-fix-plan.md
model:
  family: v3_1_motif_prompt
  config:
    motif_prompt:
      stage: two
      base_checkpoint: outputs/split_seed42/prefix_base/best.pt
      bundle_checkpoint: outputs/split_seed42/motif_prompt_stage1/best.pt
      width: 128
      slots_per_field: 2
      reader: {layers: 3, dim: 96, heads: 4, rrwp_k: 4}
      corruption: {prob: 0.5, lambda_min: 0.0, lambda_max: 1.0}
      fields: [topo_self, topo_partner, topo_rel, topo_cnt]
      families: [closure, bridge]
      token_source: graph
      gate_mode: learned
      # A1 (wave 3): the graph-only warm-up runs for eight epochs, not two. The
      # eight-epoch warm-up of the OLD generator put the V_val fit's peak at
      # epoch 6 (outputs/analysis/motif_pilot_b_v3_warm8/epoch-000N/pilot_b.md),
      # so two epochs never reached the fit this generator is capable of.
      interface_warmup_epochs: 8 # G alone for epochs 1-8 (spec section 7.5)
      # The interface-open regime of epochs 9-15 -- joint vs detached, i.e. this
      # key's value once the interface opens -- is still being decided by the
      # `warmup_losses: graph_only_always` experiment; graph_only keeps the
      # wave-3 meaning (epochs 1-8 detach task/struct/topo from G, epoch 9 opens
      # both the interface and the task gradient into G) until that lands.
      warmup_losses: graph_only # F3: epochs 1-8 detach task/struct/topo from G
      w_slot: balanced # F3: fixed once by the gradient-norm probe at epoch 9
      w_slot_multiplier: 1.0
      balance_probe_rows: 256 # first rows of the first epoch-9 task batch, rank 0
      w_topo: 0.1 # representation term towards the immutable teacher R_T
      beta_p: 1.0
      beta_q: 1.0
      beta_a: 1.0
      beta_i: 1.0
      beta_c: 0.0 # the wave-1 loss; wave 2 attributed the movement to F1, not F2
      closure_bias_init: nonzero_mean # F1: closure magnitude, not closure density
      # F4 (wave 3): the query-preserving read. The bare read returned the
      # attention output alone, so a near-uniform attention gave every slot the
      # same mean of V -- 100% of wave-2 rows had identical closure slots. The
      # residual block keeps the query on the path and initialises the slot
      # queries at unit scale; on the fixed-set generator fit it took the
      # identical-closure-row fraction from 0.6 to 0.0 and the witness-read
      # spread from 0.004 to 0.98 at no cost in held-out L_G.
      slot_read: residual_block
      # Phase C: the residual read over the RAW states. The fixed-set harness
      # round 2 measured LN_h(S) as the values against the un-normalised value
      # path, and the raw path kept the slot distinction the bare read lost
      # while restoring the magnitude information LN_h throws away
      # (outputs/analysis/motif_generator_fit_r2/*/fit.md). The slot queries keep
      # the residual block's own unit-scale rule (slot_query_init_std unset).
      slot_read_value_norm: false
      # Phase B: the closure-non-empty rows carry half of L_G's mass, the empty
      # rows the other half, per stream and over the rank-reduced counts. L_G is
      # measured on the rows of the dynamic 1:5 task stream, so about 82% of its
      # rows have an EMPTY closure family and the unweighted fit drifted to that
      # majority. The weights sum to the valid-row count, so L_G keeps its scale
      # and only the row distribution G is trained on changes; the epoch's
      # realised imbalance is logged as graph_rows_closure_nonempty_frac in
      # metrics.jsonl whether or not the weighting is on.
      graph_row_weighting: closure_balanced
      graph_row_positive_share: 0.5
      huber_delta: 1.0
data:
  root: data
  strategy: breadth_first
  negative_ratio: 5 # dynamic 1:5 stream, refreshed each epoch
  token_budget: 131072
  batch_pairs: 1024
  num_workers: 0
  f0_cache: outputs/f0_cache/f0_matrix.pt
  expected_missing_features: [node_004764, node_007050]
optim:
  lr: 1.0e-4
  weight_decay: 1.0e-2
  epochs: 15
  warmup_steps: 500 # unused while a onecycle scheduler is configured
  grad_clip: 1.0
  scheduler:
    type: onecycle
    max_lr: 1.0e-4
    pct_start: 0.1
    div_factor: 25
    final_div_factor: 10000
    anneal_strategy: cos
  groups:
    generator: {max_lr: 1.0e-4}
    interface: {max_lr: 1.0e-5} # 0.1x the generator peak (spec section 7.5)
eval:
  patience: null # full 15-epoch schedule, no early stopping (spec section 7.2)
  eval_every: 1
runtime:
  world_size: auto
  pack_dir: outputs/feature_packs/b0_v31_bf16
  pack_workers: 16
  loader_workers_per_rank: 4
  prefetch_factor: 4
  # The prefix arms' halved micro-batch, shared by every arm of this family
  # (Stage I, Stage II, every section 8 control and the teachability pilots), so
  # max_pairs_per_rank is this family's fixed batching protocol and never a
  # per-arm compute lever (spec section 7.1).
  token_budget: 196608
  max_pairs_per_rank: 1536
  memory_limit_gib: 85.0
  probe_warmup_steps: 10
  probe_timed_steps: 30
seed: 0
output_dir: outputs/split_seed42/motif_prompt_stage2_v3
mixed_precision: "bf16"
struct:
  nodes: 40
  background_nodes: 8
  mix: {bfs: 0.5, motif: 0.25, bridge: 0.25}
  subgraphs_per_epoch: null
  weights: {bce: 1.0, gs: 0.0, rd: 0.0, deg_mmd: 0.0, rank: 1.0, degree: 0.1, motif: 0.1}
  rank_margin: 0.1
  rank_temperature: 1.0
  huber_delta: 1.0
  mmd_sigma: 1.25
  mmd_bins: 48
  val_subgraphs: 32
  # The memory levers (spec section 7.1); neither touches the objective, because
  # every legal pair of the sampled subgraph is still scored exactly once into
  # the same assembled logit matrix. The structural pass runs and backpropagates
  # before the task forward, with the subgraph's pairs striped evenly over the
  # ranks. token_budget chunks a rank's share (98304 = one task batch per chunk,
  # one side, as runtime.token_budget counts both sides); resident_tokens is how
  # many chunk tokens (both sides) a rank holds without activation checkpointing
  # before the remaining chunks fall back to checkpoint-and-recompute.
  # Measured 2026-09-17 on the H20 (4 ranks): the original 8192 gave 8-16 pairs
  # per chunk against 512-1024-token nodes (~25 trunk forwards per rank per
  # step) at 46 GiB/rank and ~19 steps/min; 98304 with the joint backward gave
  # ~3 chunks per rank at 65-71 GiB/rank and ~27 steps/min. The split pass with
  # 196608 resident tokens measured 58 GiB/rank and ~33 steps/min (bridge_only,
  # same container); 393216 resident tokens holds a rank's whole structural
  # share, so nothing is recomputed: measured 58 GiB/rank (unchanged, the
  # share fits) and ~36 steps/min on stage1/bridge_only, ~28 on closure_only's
  # container. The task batch is the protocol-fixed remainder of the memory.
  # Neither subgraphs_per_epoch nor runtime.max_pairs_per_rank may be traded for
  # wall time: the first halves structural supervision, the second changes the
  # global batch, the optimizer-step count and hence the structural-subgraph count.
  token_budget: 98304
  resident_tokens: 393216
