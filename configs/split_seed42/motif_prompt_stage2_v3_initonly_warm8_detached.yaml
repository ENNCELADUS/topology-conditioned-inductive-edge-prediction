# Wave 3 of the motif-graph GRIT prompt's Stage II (deployable arm), phase A':
# the DETACHED continuation of the eight-epoch graph-only warm-up prefix
# (motif_prompt_stage2_v3_initonly_warm8_prefix). The joint continuation
# (motif_prompt_stage2_v3_initonly_warm8) let the task, structural and L_topo
# gradients reach the generator at epoch 9: V_val AUPRC fell 0.816 -> 0.800
# within one epoch, the closure gates re-saturated, and the task gradient into
# the closure head was 1400x the graph gradient by epoch 10, so selection fell
# back to warm-up epoch 6 and the test row sat in the prefix_base band. That
# confounds two questions. This arm separates them: the interface still opens
# at epoch 9 at 0.1x the generator LR and still adapts, but
# `warmup_losses: graph_only_always` keeps G cut off from every loss but L_G
# for the whole run. Question: does the reader gain downstream utility from a
# graph-supervised generator once the interface is allowed to adapt to it, with
# G protected from the task gradient? Read against the frozen-interface prefix
# (V_val AUPRC 0.816, gates_off 0.8136) and against the joint run.
# w_slot stays at its unmeasured default of 1.0 here -- the balance is a
# task/graph gradient ratio and no task gradient reaches G -- so it is a pure
# scale on L_G. Epochs 1-8 are the prefix's; 9-15 are this run's. Launch:
#   hpc/run.sh train configs/split_seed42/motif_prompt_stage2_v3_initonly_warm8_detached.yaml \
#     --resume-attempt outputs/split_seed42/motif_prompt_stage2_v3_initonly_warm8_prefix/attempts/6c11e9ac7d1744a3a20f22b6bbe46a7c
# Only output_dir, the halt point and warmup_losses (graph_only ->
# graph_only_always, identical over the prefix epochs) differ from the prefix,
# so `src.train_b0.resume_config_matches` accepts the continuation.
# Split: seed 42, root node_007630. No key selects another.
model:
  family: v3_1_motif_prompt
  config:
    motif_prompt:
      stage: two
      base_checkpoint: outputs/split_seed42/prefix_base/best.pt
      bundle_checkpoint: outputs/split_seed42/motif_prompt_stage1/best.pt
      width: 128
      slots_per_field: 2
      reader: {layers: 3, dim: 96, heads: 4, rrwp_k: 4}
      corruption: {prob: 0.5, lambda_min: 0.0, lambda_max: 1.0}
      fields: [topo_self, topo_partner, topo_rel, topo_cnt]
      families: [closure, bridge]
      token_source: graph
      gate_mode: learned
      interface_warmup_epochs: 8 # A1: G alone for epochs 1-8
      warmup_losses: graph_only_always # task/struct/topo never reach G
      w_slot: balanced # never measured here: a pure scale on L_G, left at 1.0
      w_slot_multiplier: 1.0
      balance_probe_rows: 256 # the per-epoch gradient probe still reports its norms
      w_topo: 0.1 # representation term towards the immutable teacher R_T
      beta_p: 1.0
      beta_q: 1.0
      beta_a: 1.0
      beta_i: 1.0
      beta_c: 0.0 # F2: raw closure multiset; wave 1 had no such term
      closure_bias_init: nonzero_mean # F1: closure magnitude, not closure density
      huber_delta: 1.0
data:
  root: data
  strategy: breadth_first
  negative_ratio: 5 # dynamic 1:5 stream, refreshed each epoch
  token_budget: 131072
  batch_pairs: 1024
  num_workers: 0
  f0_cache: outputs/f0_cache/f0_matrix.pt
  expected_missing_features: [node_004764, node_007050]
optim:
  lr: 1.0e-4
  weight_decay: 1.0e-2
  epochs: 15
  warmup_steps: 500 # unused while a onecycle scheduler is configured
  grad_clip: 1.0
  scheduler:
    type: onecycle
    max_lr: 1.0e-4
    pct_start: 0.1
    div_factor: 25
    final_div_factor: 10000
    anneal_strategy: cos
  groups:
    generator: {max_lr: 1.0e-4}
    interface: {max_lr: 1.0e-5} # 0.1x the generator peak (spec section 7.5)
eval:
  patience: null # full 15-epoch schedule, no early stopping (spec section 7.2)
  eval_every: 1
runtime:
  world_size: auto
  pack_dir: outputs/feature_packs/b0_v31_bf16
  pack_workers: 16
  loader_workers_per_rank: 4
  prefetch_factor: 4
  # The prefix arms' halved micro-batch, shared by every arm of this family
  # (Stage I, Stage II, every section 8 control and the teachability pilots), so
  # max_pairs_per_rank is this family's fixed batching protocol and never a
  # per-arm compute lever (spec section 7.1).
  token_budget: 196608
  max_pairs_per_rank: 1536
  memory_limit_gib: 85.0
  probe_warmup_steps: 10
  probe_timed_steps: 30
seed: 0
output_dir: outputs/split_seed42/motif_prompt_stage2_v3_initonly_warm8_detached
mixed_precision: "bf16"
struct:
  nodes: 40
  background_nodes: 8
  mix: {bfs: 0.5, motif: 0.25, bridge: 0.25}
  subgraphs_per_epoch: null
  weights: {bce: 1.0, gs: 0.0, rd: 0.0, deg_mmd: 0.0, rank: 1.0, degree: 0.1, motif: 0.1}
  rank_margin: 0.1
  rank_temperature: 1.0
  huber_delta: 1.0
  mmd_sigma: 1.25
  mmd_bins: 48
  val_subgraphs: 32
  # The memory levers (spec section 7.1); neither touches the objective, because
  # every legal pair of the sampled subgraph is still scored exactly once into
  # the same assembled logit matrix. The structural pass runs and backpropagates
  # before the task forward, with the subgraph's pairs striped evenly over the
  # ranks. token_budget chunks a rank's share (98304 = one task batch per chunk,
  # one side, as runtime.token_budget counts both sides); resident_tokens is how
  # many chunk tokens (both sides) a rank holds without activation checkpointing
  # before the remaining chunks fall back to checkpoint-and-recompute.
  # Measured 2026-09-17 on the H20 (4 ranks): the original 8192 gave 8-16 pairs
  # per chunk against 512-1024-token nodes (~25 trunk forwards per rank per
  # step) at 46 GiB/rank and ~19 steps/min; 98304 with the joint backward gave
  # ~3 chunks per rank at 65-71 GiB/rank and ~27 steps/min. The split pass with
  # 196608 resident tokens measured 58 GiB/rank and ~33 steps/min (bridge_only,
  # same container); 393216 resident tokens holds a rank's whole structural
  # share, so nothing is recomputed: measured 58 GiB/rank (unchanged, the
  # share fits) and ~36 steps/min on stage1/bridge_only, ~28 on closure_only's
  # container. The task batch is the protocol-fixed remainder of the memory.
  # Neither subgraphs_per_epoch nor runtime.max_pairs_per_rank may be traded for
  # wall time: the first halves structural supervision, the second changes the
  # global batch, the optimizer-step count and hence the structural-subgraph count.
  token_budget: 98304
  resident_tokens: 393216
