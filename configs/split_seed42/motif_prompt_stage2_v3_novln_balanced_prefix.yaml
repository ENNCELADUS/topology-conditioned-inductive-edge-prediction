# Wave 3 of the motif-graph GRIT prompt's Stage II, the DEPLOYABLE arm, phase
# C x phase B: motif_prompt_stage2_v3_novln_prefix.yaml -- the un-normalised
# residual read -- with the closure-balanced graph-loss rows on top.
# A residue-conditioned generator G predicts the 96 motif edge weights from
# (x_u, x_v) alone; the Stage I bundle -- GRIT reader, count head, token
# projections, role embeddings and the prefix adapter with its gates --
# initialises both the student interface and the immutable teacher R_T, and the
# frozen prefix_base trunk reads the predicted graph through the same four gated
# KV-prefix token fields. Scoring loads only the saved model and endpoint
# features: no node ids, no neighbour lookup, no truth graph, no bank, no
# universe statistic. Launched as a formal run, without --run-kind.
#
# This is a two-epoch PREFIX (optim.stop_after_epoch: 2, epochs stays 15 so the
# one-cycle shape, the trainability mask and the data order are the full run's).
#
# The setting is motif_prompt_stage2_v3_prefix plus the two phase-C/phase-B
# keys: slot_read_value_norm: false and graph_row_weighting: closure_balanced at
# graph_row_positive_share: 0.5. L_G is measured on the rows of the dynamic 1:5
# task stream, so about 82% of its rows have an EMPTY closure family; the
# weighting gives the closure-non-empty rows half of L_G's mass and the empty
# rows the other half, per stream and with the counts summed over ranks. The
# weights sum to the valid-row count, so L_G keeps its scale and only the row
# distribution G is trained on changes. NOTHING else moves: the task stream, the
# sampler, the structural stream, the task BCE and every other loss are
# untouched, which is what makes this arm readable against
# motif_prompt_stage2_v3_novln_prefix. The epoch's realised imbalance is logged
# as graph_rows_closure_nonempty_frac in metrics.jsonl whether or not the
# weighting is on. Question: on top of the restored value path, does removing
# the row imbalance move G further off the empty-closure majority?
#
# Launch:
#   hpc/run.sh train configs/split_seed42/motif_prompt_stage2_v3_novln_balanced_prefix.yaml --skip-test
# Read by src.experiments.motif_pilot_b and src.experiments.motif_generator_probe
# against outputs/analysis/motif_pilot_b_motif_prompt_stage2_v3_novln_prefix.
# Split: seed 42, root node_007630. No key selects another.
# Spec: docs/superpowers/specs/2026-09-16-motif-graph-grit-prompt-design.md
# Plan: docs/tmp/2026-09-18-motif-stage2-fix-plan.md
model:
  family: v3_1_motif_prompt
  config:
    motif_prompt:
      stage: two
      base_checkpoint: outputs/split_seed42/prefix_base/best.pt
      bundle_checkpoint: outputs/split_seed42/motif_prompt_stage1/best.pt
      width: 128
      slots_per_field: 2
      reader: {layers: 3, dim: 96, heads: 4, rrwp_k: 4}
      corruption: {prob: 0.5, lambda_min: 0.0, lambda_max: 1.0}
      fields: [topo_self, topo_partner, topo_rel, topo_cnt]
      families: [closure, bridge]
      token_source: graph
      gate_mode: learned
      interface_warmup_epochs: 2 # G alone for epochs 1-2 (spec section 7.5)
      warmup_losses: graph_only # F3: epochs 1-2 detach task/struct/topo from G
      w_slot: balanced # F3: fixed once by the gradient-norm probe at epoch 3
      w_slot_multiplier: 1.0
      balance_probe_rows: 256 # first rows of the first epoch-3 task batch, rank 0
      w_topo: 0.1 # representation term towards the immutable teacher R_T
      beta_p: 1.0
      beta_q: 1.0
      beta_a: 1.0
      beta_i: 1.0
      beta_c: 0.0 # F2: raw closure multiset; wave 1 had no such term
      closure_bias_init: nonzero_mean # F1: closure magnitude, not closure density
      # F4 (wave 3): the query-preserving read. The bare read returned the
      # attention output alone, so a near-uniform attention gave every slot the
      # same mean of V -- 100% of wave-2 rows had identical closure slots. The
      # residual block keeps the query on the path and initialises the slot
      # queries at unit scale; on the fixed-set generator fit it took the
      # identical-closure-row fraction from 0.6 to 0.0 and the witness-read
      # spread from 0.004 to 0.98 at no cost in held-out L_G.
      slot_read: residual_block
      # Wave 3, phase C: the fixed-set harness round 2 measured the residual
      # read with its value path normalised (LN_h(S) as the values) against the
      # same read over the raw states, and the un-normalised value path kept the
      # slot distinction the bare read lost while restoring the magnitude
      # information LN_h throws away; it was selected as the configuration to
      # carry to the full corpus
      # (outputs/analysis/motif_generator_fit_r2/*/fit.md). The slot queries
      # keep the residual block's own unit-scale rule
      # (slot_query_init_std unset).
      slot_read_value_norm: false
      # Phase C x phase B: the closure-non-empty rows carry half of L_G's mass,
      # the empty rows the other half, per stream and over the reduced counts.
      # The task stream is a dynamic 1:5 stream, so about 82% of L_G's rows have
      # an EMPTY closure family and the plain residual-block prefix's fit drifted
      # to that majority. The epoch's realised imbalance is logged as
      # graph_rows_closure_nonempty_frac in metrics.jsonl either way.
      graph_row_weighting: closure_balanced
      graph_row_positive_share: 0.5
      huber_delta: 1.0
data:
  root: data
  strategy: breadth_first
  negative_ratio: 5 # dynamic 1:5 stream, refreshed each epoch
  token_budget: 131072
  batch_pairs: 1024
  num_workers: 0
  f0_cache: outputs/f0_cache/f0_matrix.pt
  expected_missing_features: [node_004764, node_007050]
optim:
  lr: 1.0e-4
  weight_decay: 1.0e-2
  epochs: 15
  stop_after_epoch: 2 # a halted prefix; the schedule stays the full 15
  warmup_steps: 500 # unused while a onecycle scheduler is configured
  grad_clip: 1.0
  scheduler:
    type: onecycle
    max_lr: 1.0e-4
    pct_start: 0.1
    div_factor: 25
    final_div_factor: 10000
    anneal_strategy: cos
  groups:
    generator: {max_lr: 1.0e-4}
    interface: {max_lr: 1.0e-5} # 0.1x the generator peak (spec section 7.5)
eval:
  patience: null # full 15-epoch schedule, no early stopping (spec section 7.2)
  eval_every: 1
runtime:
  world_size: auto
  pack_dir: outputs/feature_packs/b0_v31_bf16
  pack_workers: 16
  loader_workers_per_rank: 4
  prefetch_factor: 4
  # The prefix arms' halved micro-batch, shared by every arm of this family
  # (Stage I, Stage II, every section 8 control and the teachability pilots), so
  # max_pairs_per_rank is this family's fixed batching protocol and never a
  # per-arm compute lever (spec section 7.1).
  token_budget: 196608
  max_pairs_per_rank: 1536
  memory_limit_gib: 85.0
  probe_warmup_steps: 10
  probe_timed_steps: 30
seed: 0
output_dir: outputs/split_seed42/motif_prompt_stage2_v3_novln_balanced_prefix
mixed_precision: "bf16"
struct:
  nodes: 40
  background_nodes: 8
  mix: {bfs: 0.5, motif: 0.25, bridge: 0.25}
  subgraphs_per_epoch: null
  weights: {bce: 1.0, gs: 0.0, rd: 0.0, deg_mmd: 0.0, rank: 1.0, degree: 0.1, motif: 0.1}
  rank_margin: 0.1
  rank_temperature: 1.0
  huber_delta: 1.0
  mmd_sigma: 1.25
  mmd_bins: 48
  val_subgraphs: 32
  # The memory levers (spec section 7.1); neither touches the objective, because
  # every legal pair of the sampled subgraph is still scored exactly once into
  # the same assembled logit matrix. The structural pass runs and backpropagates
  # before the task forward, with the subgraph's pairs striped evenly over the
  # ranks. token_budget chunks a rank's share (98304 = one task batch per chunk,
  # one side, as runtime.token_budget counts both sides); resident_tokens is how
  # many chunk tokens (both sides) a rank holds without activation checkpointing
  # before the remaining chunks fall back to checkpoint-and-recompute.
  # Measured 2026-09-17 on the H20 (4 ranks): the original 8192 gave 8-16 pairs
  # per chunk against 512-1024-token nodes (~25 trunk forwards per rank per
  # step) at 46 GiB/rank and ~19 steps/min; 98304 with the joint backward gave
  # ~3 chunks per rank at 65-71 GiB/rank and ~27 steps/min. The split pass with
  # 196608 resident tokens measured 58 GiB/rank and ~33 steps/min (bridge_only,
  # same container); 393216 resident tokens holds a rank's whole structural
  # share, so nothing is recomputed: measured 58 GiB/rank (unchanged, the
  # share fits) and ~36 steps/min on stage1/bridge_only, ~28 on closure_only's
  # container. The task batch is the protocol-fixed remainder of the memory.
  # Neither subgraphs_per_epoch nor runtime.max_pairs_per_rank may be traded for
  # wall time: the first halves structural supervision, the second changes the
  # global batch, the optimizer-step count and hence the structural-subgraph count.
  token_budget: 98304
  resident_tokens: 393216
