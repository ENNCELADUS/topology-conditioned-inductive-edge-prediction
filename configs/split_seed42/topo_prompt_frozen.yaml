# topo_prompt_frozen: the frozen-trunk control of Stage I. The published prefix_base
# trunk stays frozen (eval mode, no gradient) and only the prompt path trains: the
# coordinate tokenizer, per-layer prefix projections, static offsets and the 72 gates.
# Same true structural coordinates, same task-BCE stream as topo_prompt_full. Read it
# against prefix_pair_bce (attribute-conditioned prefix, same trainable scope) and
# prefix_base. Ceiling diagnostic:
#   hpc/run.sh train configs/split_seed42/topo_prompt_frozen.yaml --run-kind diagnostic
# Spec: docs/superpowers/specs/2026-09-12-topology-prompt-stage1-design.md.
model:
  family: v3_1_topo_prompt
  config:
    topo_prompt:
      trainable: prompt
      base_checkpoint: outputs/split_seed42/prefix_base/best.pt
      width: 128
      slots_per_field: 2
      field_mask_prob: 0.1
data:
  root: data
  strategy: breadth_first
  negative_ratio: 5
  token_budget: 131072
  batch_pairs: 1024
  num_workers: 0
  f0_cache: outputs/f0_cache/f0_matrix.pt
  expected_missing_features: [node_004764, node_007050]
optim:
  lr: 1.0e-3
  weight_decay: 0.05
  epochs: 25
  warmup_steps: 500
  grad_clip: 1.0
  scheduler:
    type: onecycle
    max_lr: 1.0e-3
    pct_start: 0.1
    div_factor: 25
    final_div_factor: 10000
    anneal_strategy: cos
eval:
  patience: 10
  eval_every: 1
runtime:
  world_size: auto
  pack_dir: outputs/feature_packs/b0_v31_bf16
  pack_workers: 16
  loader_workers_per_rank: 4
  prefetch_factor: 4
  token_budget: 262144
  max_pairs_per_rank: 2048
  memory_limit_gib: 85.0
  probe_warmup_steps: 10
  probe_timed_steps: 30
seed: 0
output_dir: outputs/split_seed42/topo_prompt_frozen
mixed_precision: "bf16"
