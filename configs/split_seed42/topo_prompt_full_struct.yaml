# Approved v2 Stage I ceiling diagnostic; no run launched.
# Use --run-kind diagnostic --skip-test for study trials.
# Spec: docs/superpowers/specs/2026-09-13-topology-prompt-two-stage-v2-design.md
model:
  family: v3_1_topo_prompt
  config:
    topo_prompt:
      trainable: all
      width: 128
      slots_per_field: 2
      field_mask_prob: 0.1
      corruption:
        prob: 0.5
        shrink_min: 0.3
        sigma_max: 0.5
    base:
      input_dim: 1536
      d_model: 512
      encoder_layers: 3
      cross_attn_layers: 3
      n_heads: 8
      mlp_head:
        hidden_dims:
        - 512
        - 256
        - 128
        dropout: 0.2
        activation: gelu
        norm: layernorm
        spectral_norm: false
      regularization:
        dropout: 0.1
        token_dropout: 0.1
        cross_attention_dropout: 0.1
        stochastic_depth: 0.1
      rich_pooling:
        components:
        - mean
        - attn
        - max
        - gated
      pair_readout:
        mode: pair_context_gated
        order_aggregation: abba_max
        spectral_norm: false
      mixing:
        mode: bidirectional_cross
      label_smoothing: 0.0
      positive_weight: 5.0
data:
  root: data
  strategy: breadth_first
  negative_ratio: 5
  token_budget: 131072
  batch_pairs: 1024
  num_workers: 0
  f0_cache: outputs/f0_cache/f0_matrix.pt
  expected_missing_features:
  - node_004764
  - node_007050
optim:
  lr: 0.0001
  weight_decay: 0.05
  epochs: 25
  warmup_steps: 500
  grad_clip: 1.0
  scheduler:
    type: onecycle
    max_lr: 0.0001
    pct_start: 0.1
    div_factor: 25
    final_div_factor: 10000
    anneal_strategy: cos
eval:
  patience: 10
  eval_every: 1
runtime:
  world_size: auto
  pack_dir: outputs/feature_packs/b0_v31_bf16
  pack_workers: 16
  loader_workers_per_rank: 4
  prefetch_factor: 4
  token_budget: 262144
  max_pairs_per_rank: 2048
  memory_limit_gib: 93.0   # engineering limit only; the trunk's task step is already 83 GiB
  probe_warmup_steps: 10
  probe_timed_steps: 30
seed: 0
output_dir: outputs/split_seed42/topo_prompt_full_struct
mixed_precision: bf16
struct:
  nodes: 40
  background_nodes: 8
  mix:
    bfs: 0.5
    motif: 0.25
    bridge: 0.25
  subgraphs_per_epoch: null
  weights:
    bce: 1.0
    gs: 0.0
    rd: 0.0
    deg_mmd: 0.0
    rank: 1.0
    degree: 0.1
    motif: 0.1
  rank_margin: 0.1
  rank_temperature: 1.0
  huber_delta: 1.0
  mmd_sigma: 1.25
  mmd_bins: 48
  val_subgraphs: 32
  scale: 1.0
  # Stream-only chunk budget. The task step alone peaks at 83 GiB per rank on this
  # fully trainable bidirectional-cross trunk (topo_prompt_full profile), so the
  # checkpointed subgraph chunk must stay small: 131072- and 65536-token chunks both
  # OOMed at 95 GiB in the epoch probe (2026-09-13). data.token_budget stays 131072 so
  # the task epoch plan is identical to topo_prompt_full_v2.
  token_budget: 8192
