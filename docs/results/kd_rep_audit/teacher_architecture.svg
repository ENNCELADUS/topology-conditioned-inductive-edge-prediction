<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#111"/>
    </marker>
    <marker id="kd" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b45309"/>
    </marker>
    <style>
      .mod { fill: #ffffff; stroke: #111; stroke-width: 1.4; }
      .modT { fill: #e8f0fe; stroke: #111; stroke-width: 1.4; }
      .ten { fill: #f7f7f7; stroke: #111; stroke-width: 1.4; }
      .tenT { fill: #e8f0fe; stroke: #111; stroke-width: 1.4; }
      .lbl { font-family: Helvetica, Arial, sans-serif; font-size: 15px; text-anchor: middle; }
      .math { font-family: 'STIX Two Math', 'Latin Modern Math', 'Times New Roman', Times, serif; font-style: italic; font-size: 19px; text-anchor: middle; }
      .sub { font-size: 13px; }
      .kdl { font-family: 'STIX Two Math', 'Times New Roman', Times, serif; font-style: italic; font-size: 17px; fill: #b45309; }
      .leg { font-family: Helvetica, Arial, sans-serif; font-size: 13px; }
    </style>
  </defs>
  <rect width="900" height="700" fill="#ffffff"/>

  <!-- shared column: input -> pairwise encoder -> c_uv -->
  <rect x="80" y="40" width="220" height="48" rx="24" class="ten"/>
  <text x="190" y="71" class="math">(x<tspan dy="5" class="sub">u</tspan><tspan dy="-5">, x</tspan><tspan dy="5" class="sub">v</tspan><tspan dy="-5">)</tspan></text>
  <rect x="80" y="140" width="220" height="52" class="mod"/>
  <text x="190" y="171" class="lbl" font-weight="bold">Pairwise encoder</text>
  <rect x="80" y="244" width="220" height="48" rx="24" class="ten"/>
  <text x="190" y="275" class="math" font-weight="bold">c<tspan dy="5" class="sub" font-weight="normal">uv</tspan></text>

  <!-- teacher column: ego graph -> GRIT + PMA -> t_uv -->
  <rect x="600" y="40" width="220" height="48" rx="24" class="tenT"/>
  <text x="710" y="71" class="math">G<tspan dy="5" class="sub">uv</tspan><tspan dy="-5" font-style="normal" font-size="14"> (hidden ego graph)</tspan></text>
  <rect x="600" y="140" width="220" height="52" class="modT"/>
  <text x="710" y="161" class="lbl" font-weight="bold">GRIT (graph transformer)</text>
  <text x="710" y="181" class="lbl" font-weight="bold">+ PMA (set attention pooling)</text>
  <rect x="600" y="244" width="220" height="48" rx="24" class="tenT"/>
  <text x="710" y="275" class="math" font-weight="bold">t<tspan dy="5" class="sub" font-weight="normal">uv</tspan></text>

  <!-- fusion -> f_uv -> head -> p_uv -->
  <rect x="340" y="352" width="220" height="52" class="modT"/>
  <text x="450" y="383" class="lbl" font-weight="bold">Fusion</text>
  <rect x="340" y="444" width="220" height="48" rx="24" class="tenT"/>
  <text x="450" y="475" class="math" font-weight="bold">f<tspan dy="5" class="sub" font-weight="normal">uv</tspan></text>
  <rect x="340" y="532" width="220" height="52" class="mod"/>
  <text x="450" y="563" class="lbl" font-weight="bold">Classifier head</text>
  <rect x="340" y="624" width="220" height="48" rx="24" class="ten"/>
  <text x="450" y="655" class="math">p̂<tspan dy="5" class="sub">uv</tspan><tspan dy="-5" font-style="normal"> = P(edge | </tspan><tspan font-style="italic">u</tspan><tspan font-style="normal">, </tspan><tspan font-style="italic">v</tspan><tspan font-style="normal">)</tspan></text>

  <!-- forward arrows -->
  <g stroke="#111" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M190,88 L190,138"/>
    <path d="M190,192 L190,242"/>
    <path d="M710,88 L710,138"/>
    <path d="M710,192 L710,242"/>
    <path d="M190,292 L190,378 L338,378"/>
    <path d="M710,292 L710,378 L562,378"/>
    <path d="M450,404 L450,442"/>
    <path d="M450,492 L450,530"/>
    <path d="M450,584 L450,622"/>
  </g>
  <text x="272" y="340" class="math" style="font-style:normal" font-size="14" fill="#444">student: <tspan font-style="italic" font-weight="bold">f</tspan><tspan dy="4" class="sub" font-style="italic">uv</tspan><tspan dy="-4"> = </tspan><tspan font-style="italic" font-weight="bold">c</tspan><tspan dy="4" class="sub" font-style="italic">uv</tspan></text>

  <!-- distillation losses -->
  <g stroke="#b45309" stroke-width="1.8" fill="none" stroke-dasharray="7,5" marker-end="url(#kd)">
    <path d="M600,268 L302,268"/>
    <path d="M560,638 L640,638"/>
    <path d="M560,660 L640,660"/>
  </g>
  <text x="450" y="258" class="kdl" text-anchor="middle">L<tspan dy="5" font-size="12" font-style="normal">KD3</tspan><tspan dy="-5" font-style="normal"> (Gram),  </tspan><tspan font-style="italic">L</tspan><tspan dy="5" font-size="12" font-style="normal">KD4</tspan><tspan dy="-5" font-style="normal"> (cosine)</tspan></text>
  <text x="650" y="643" class="kdl">L<tspan dy="5" font-size="12" font-style="normal">KD1</tspan><tspan dy="-5" font-style="normal"> (soft logits)</tspan></text>
  <text x="650" y="665" class="kdl">L<tspan dy="5" font-size="12" font-style="normal">KD2</tspan><tspan dy="-5" font-style="normal"> (listwise, context banks)</tspan></text>

  <!-- legend -->
  <rect x="60" y="560" width="26" height="16" class="mod"/>
  <text x="96" y="573" class="leg">model layer</text>
  <rect x="60" y="588" width="26" height="16" rx="8" class="ten"/>
  <text x="96" y="601" class="leg">tensor (input, output, representation)</text>
  <rect x="60" y="616" width="26" height="16" class="tenT"/>
  <text x="96" y="629" class="leg">teacher only (white: teacher and student)</text>
  <line x1="60" y1="652" x2="86" y2="652" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7,5"/>
  <text x="96" y="657" class="leg">distillation loss, teacher → student</text>
</svg>
