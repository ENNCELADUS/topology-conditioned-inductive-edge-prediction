<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-labelledby="title desc">
  <title id="title">Topology oracle versus pairwise baseline headline results</title>
  <desc id="desc">Held-out test comparison of pairwise classification and density-matched assembled-graph topology metrics.</desc>
  <style>
    text { fill: #16181d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 27px; font-weight: 700; }
    .subtitle, .note, .category { fill: #5c6370; }
    .subtitle { font-size: 15px; }
    .group { font-size: 15px; font-weight: 650; text-anchor: middle; }
    .header { font-size: 14px; font-weight: 650; text-anchor: middle; }
    .label { font-size: 15px; font-weight: 600; }
    .category { font-size: 13px; }
    .value { font-size: 15px; text-anchor: middle; font-variant-numeric: tabular-nums; }
    .note { font-size: 13px; }
    .rule { stroke: #16181d; stroke-width: 1.5; }
    .hair { stroke: #d3d7de; stroke-width: 1; }
    .oracle { fill: #c9dcf7; }
    .baseline { fill: #f6f7f9; }
  </style>

  <rect width="1600" height="430" fill="#ffffff"/>
  <text class="title" x="40" y="43">Topology oracle vs. pairwise baseline</text>
  <text class="subtitle" x="40" y="70">Held-out test protocol · pairwise ranking and fixed-0.5 decisions · density-matched topology assembly</text>

  <line class="rule" x1="40" y1="100" x2="1560" y2="100"/>
  <line class="hair" x1="40" y1="150" x2="1560" y2="150"/>
  <line class="rule" x1="40" y1="200" x2="1560" y2="200"/>
  <line class="hair" x1="40" y1="270" x2="1560" y2="270"/>
  <line class="rule" x1="40" y1="340" x2="1560" y2="340"/>

  <rect class="baseline" x="40" y="201" width="1520" height="69"/>
  <rect class="oracle" x="430" y="271" width="1130" height="68"/>

  <line class="hair" x1="170" y1="100" x2="170" y2="340"/>
  <line class="hair" x1="430" y1="100" x2="430" y2="340"/>
  <line class="hair" x1="830" y1="100" x2="830" y2="340"/>
  <line class="hair" x1="1010" y1="100" x2="1010" y2="340"/>

  <text class="group" x="105" y="132">Category</text>
  <text class="group" x="300" y="132">Model</text>
  <text class="group" x="630" y="126">Pairwise classification</text>
  <text class="subtitle" x="630" y="144" text-anchor="middle">ranking + fixed-0.5 decisions</text>
  <text class="group" x="920" y="126">Global simple-edge</text>
  <text class="subtitle" x="920" y="144" text-anchor="middle">density-matched</text>
  <text class="group" x="1285" y="126">BFS-macro (official)</text>
  <text class="subtitle" x="1285" y="144" text-anchor="middle">density-matched</text>

  <text class="header" x="470" y="181">AUROC ↑</text>
  <text class="header" x="550" y="181">AUPRC ↑</text>
  <text class="header" x="630" y="181">Accuracy ↑</text>
  <text class="header" x="710" y="181">F1 ↑</text>
  <text class="header" x="790" y="181">MCC ↑</text>
  <text class="header" x="875" y="181">GS ↑</text>
  <text class="header" x="965" y="181">RD → 1</text>
  <text class="header" x="1060" y="181">GS ↑</text>
  <text class="header" x="1160" y="181">RD → 1</text>
  <text class="header" x="1260" y="181">Degree ↓</text>
  <text class="header" x="1370" y="181">Clustering ↓</text>
  <text class="header" x="1505" y="181">Spectral ↓</text>

  <text class="category" x="55" y="241">Baseline</text>
  <text class="label" x="185" y="241">Pairwise baseline</text>
  <text class="value" x="470" y="241">0.7067</text>
  <text class="value" x="550" y="241">0.7315</text>
  <text class="value" x="630" y="241">0.6083</text>
  <text class="value" x="710" y="241">0.3987</text>
  <text class="value" x="790" y="241">0.3020</text>
  <text class="value" x="875" y="241">0.1365</text>
  <text class="value" x="965" y="241">0.9977</text>
  <text class="value" x="1060" y="241">0.3896</text>
  <text class="value" x="1160" y="241">0.4223</text>
  <text class="value" x="1260" y="241">13.08</text>
  <text class="value" x="1370" y="241">11.93</text>
  <text class="value" x="1505" y="241">18.09</text>

  <text class="category" x="55" y="303">True-oracle</text>
  <text class="category" x="55" y="320">diagnostic</text>
  <text class="label" x="185" y="311">Topology oracle</text>
  <text class="value" x="470" y="311">0.8524</text>
  <text class="value" x="550" y="311">0.8698</text>
  <text class="value" x="630" y="311">0.7713</text>
  <text class="value" x="710" y="311">0.7599</text>
  <text class="value" x="790" y="311">0.5451</text>
  <text class="value" x="875" y="311">0.3076</text>
  <text class="value" x="965" y="311">1.0000</text>
  <text class="value" x="1060" y="311">0.4886</text>
  <text class="value" x="1160" y="311">0.7542</text>
  <text class="value" x="1260" y="311">5.825</text>
  <text class="value" x="1370" y="311">5.288</text>
  <text class="value" x="1505" y="311">9.302</text>

  <text class="note" x="40" y="374">GS: edge-set Dice/F1 (↑) · RD: predicted/reference density (→ 1) · Degree/Clustering/Spectral: reference-normalized MMD ratios (↓)</text>
  <text class="note" x="40" y="400">Pairwise metrics include self-loop queries; AUROC/AUPRC are threshold-free and Accuracy/F1/MCC use threshold 0.5. Global simple-edge strips self-loops; BFS-macro retains them.</text>
</svg>
