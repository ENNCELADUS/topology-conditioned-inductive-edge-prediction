# Method overview figure v4 for the ICLR 2027 paper (canonical source for
# figures/method_overview_v4.{drawio,svg,png,pdf}).
#
# Architecture drawn: docs/superpowers/specs/2026-09-16-motif-graph-grit-prompt-design.md (v9):
# frozen prefix_base residue encoder E, pair reader F and MLP head; the generator G shown as
# slot attention -> fixed motif template -> message passing + typed edge gates -> Â_uv; the GRIT
# reader R and count head N reading the same graph; the four topology tokens; the gated KV
# prefix Π; and the Stage I teacher path feeding the compiled true motif graph A*_uv.
# Layer / module names and intermediate terms only; no widths, depths or hyper-parameters.
#
# Layout: teacher column (left), generator column (middle), legend (right), reading pipeline as
# the bottom row. Visual grammar as figures/specs/method_overview.spec.yaml (v1): rectangles =
# layers, stadiums = tensors, fill = who trains it / who may see it, orange dashed = supervision.
# Naming follows the specification: G is the generator, A* / Â the compiled and generated graphs.
#
# Re-render (draw.io skill CLI; no draw.io Desktop on this Mac, so PNG/PDF come from headless Chrome):
#   node ~/.claude/skills/drawio/scripts/cli.js figures/specs/method_overview_v4.spec.yaml figures/method_overview_v4.drawio --validate
#   python3 figures/specs/straighten_template_edges.py     # straight template edges, then SVG via the skill renderer
#   PNG: headless Chrome --screenshot on the SVG
#   PDF: headless Chrome --print-to-pdf on an HTML wrapper with @page{size:<W>px <H>px;margin:0}
# The CLI forces every connector orthogonal; the post-step rewrites only the edges whose stroke
# is the closure colour #2E6FBF or the bridge colour #2A9D5C (the template drawing) to straight
# lines without arrowheads, in the .drawio and hence in the SVG.
meta:
  profile: academic-paper
  figureType: architecture
  theme: academic-color
  source: generated
  layout: vertical
  routing: orthogonal
  print: { widthPt: 396, minPt: 5.5 }
  font:
    primary: "Helvetica, Arial, sans-serif"
    cjk: "Helvetica, Arial, sans-serif"
    formula: "Times New Roman, Times, serif"
  title: "Topology-conditioned inductive edge prediction: motif-graph prompt, teacher and student"
  description: >-
    The frozen residue encoder E gives the endpoint states H_u, H_v. The generator G lets learned
    slot queries read them, places the slot states on a fixed motif template (closure slots C between
    u and v, bridge slots L and R), runs message passing over the template and predicts one weight per
    allowed edge, giving the motif graph Â_uv. A GRIT reader R and a closed-form count head N read that
    graph and emit four topology tokens, which a gated key/value prefix Π injects into the frozen pair
    reader F; the frozen MLP head returns p̂_uv. In Stage I the readers and the prefix are trained on
    the true motif graph A*_uv compiled from the training graph with the queried edge removed; in
    Stage II the generator learns to produce Â_uv from the two endpoints alone.
  legend: >-
    Rectangles are layers, stadiums are tensors. Lavender: pretrained pair model, frozen throughout.
    Yellow: trained in Stage II (student). Blue: trained in Stage I on true motif graphs, lightly
    fine-tuned in Stage II. Pink: teacher only, true structure. Green: student only, generated from
    features. Orange dashed: supervision or distillation loss. Blue lines: closure edges u–c–v;
    green lines: bridge edges u–l–r–v.

