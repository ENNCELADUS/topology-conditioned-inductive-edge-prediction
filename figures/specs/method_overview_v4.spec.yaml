# Method overview figure v4 for the ICLR 2027 paper (canonical source for
# figures/method_overview_v4.{drawio,svg,png,pdf}).
#
# Architecture drawn: docs/superpowers/specs/2026-09-16-motif-graph-grit-prompt-design.md (v9)
#   S1 task contract, S2 the 26-slot / 96-edge motif graph, S4 generator G,
#   S5 count head + GRIT reader R, S6 the gated KV prefix interface with frozen F,
#   S7 the two stages, the trainability table and where the losses attach.
#
# Naming: G is the GENERATOR throughout, as in the specification. The observed graph is
# called "the legal training graph"; its compiled 26-slot template is A*.
#
# Style follows figures/specs/method_overview.spec.yaml and figures/tmp/method_overview_v3.spec.yaml:
#   rectangles = layers, stadiums = tensors, circles = motif slots,
#   fill = who trains it / who may see it, orange dashed = supervision.
# The three edge families carry two channels (hue and stroke weight), so colour is
# never the only carrier of meaning.
#
# Re-render (draw.io skill CLI; no draw.io Desktop on this Mac, so PNG/PDF come from headless Chrome):
#   node ~/.claude/skills/drawio/scripts/cli.js figures/specs/method_overview_v4.spec.yaml \\
#        figures/method_overview_v4.drawio --validate
#   node ~/.claude/skills/drawio/scripts/cli.js figures/specs/method_overview_v4.spec.yaml \\
#        figures/method_overview_v4.svg --validate
#   PNG: headless Chrome --screenshot on the SVG
#   PDF: headless Chrome --print-to-pdf on an HTML wrapper with @page{size:<W>px <H>px;margin:0}
meta:
  profile: academic-paper
  figureType: architecture
  theme: academic-color
  palette: okabe-ito
  source: generated
  layout: vertical
  routing: orthogonal
  print: { widthPt: 396, minPt: 7 }
  font:
    primary: "Helvetica, Arial, sans-serif"
    cjk: "Helvetica, Arial, sans-serif"
    formula: "Times New Roman, Times, serif"
  title: "Motif graph prompts read by GRIT: the deployable topology arm"
  description: "The strict input is the endpoint pair (x_u, x_v). A frozen residue encoder from the published prefix_base gives H_u and H_v; the generator G turns them into one sigmoid weight per allowed edge of a fixed 26-slot motif graph. Two readers see that same predicted adjacency: a closed-form count head emits topo_cnt, and a three-layer GRIT reader emits topo_u, topo_v and topo_rel. The four ordered fields enter a gated KV prefix adapter at all nine cross-attention sites of the frozen pair reader F, whose frozen MLP head returns p_uv = p_vu. Stage I feeds A*, compiled from the legal training graph with the queried edge removed, and trains the reader side only; Stage II feeds the generated graph and trains G, opening part of R after a two-epoch warm-up."
  legend: "Rectangles are layers, stadiums are tensors, circles are motif slots. G denotes the generator throughout; the observed graph is called the legal training graph. Blue: frozen in both stages, the published prefix_base. Yellow: trained in Stage I and partly reopened in Stage II. Green: trained in Stage II only, the generator G. Pink: true structure, Stage I and teacher only, never available at inference. Blue lines are the 16 closure edges, green lines the 16 attach edges, and the shaded block the 64 interior edges. Orange dashed arrows are training losses."

