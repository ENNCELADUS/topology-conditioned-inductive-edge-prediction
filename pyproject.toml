[project]
name = "topology-conditioned-inductive-edge-prediction"
version = "0.1.0"
description = "Topology-conditioned inductive edge prediction experiments."
readme = "README.md"
requires-python = ">=3.11,<3.12"
keywords = [
    "graph-machine-learning",
    "inductive-edge-prediction",
    "topology",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate==1.13.0",
    "networkx==3.6.1",
    "numpy==2.3.5",
    "optuna==4.7.0",
    "pyyaml==6.0.3",
    "scikit-learn==1.8.0",
    "scipy==1.17.0",
    "torch==2.10.0",
    "torch-geometric>=2.8.0.post1",
]

[dependency-groups]
dev = [
    "coverage==7.13.4",
    "deptry==0.24.0",
    "mypy==1.19.1",
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "pytest-xdist==3.8.0",
    "ruff==0.15.0",
    "vulture==2.14",
]

[tool.uv]
package = false
managed = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# -n auto parallelizes across cores; --dist loadfile keeps every test in a file
# on one worker. That grouping is required, not merely tidy: with per-test
# distribution (--dist load) 19 tests in tests/test_train_egostitch_e2e.py fail
# on shared in-file state. Drop to `-p no:xdist` or `-n0` when debugging, since
# xdist swallows breakpoints and interleaves output.
addopts = ["-q", "-ra", "--strict-markers", "-n", "auto", "--dist", "loadfile"]
norecursedirs = [".*", "__pycache__"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".codex"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "ANN",
    "D",
    "T201",
]
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "ANN201",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = true
